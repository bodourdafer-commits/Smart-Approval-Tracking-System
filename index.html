 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Request - Smart Approval</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Submit New Request</h2>
        <label>Request Type:</label>
        <select id="requestType">
            <option value="Vacation">Vacation</option>
            <option value="Promotion">Promotion</option>
        </select>

        <label>Description:</label>
        <textarea id="description" rows="4" placeholder="Enter request details..."></textarea>

        <button onclick="sendRequest()">Send Request</button>
        <button class="secondary-btn" onclick="location.href='requests.html'">View My Requests</button>
    </div>

    <script>
        async function sendRequest() {
            const data = {
                type: document.getElementById('requestType').value,
                description: document.getElementById('description').value,
                status: 'Pending'
            };

            const response = await fetch('http://localhost:3000/requests', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(response.ok) {
                alert('Request Sent Successfully!');
                location.href = 'requests.html';
            }
        }
    </script>
</body>
</html>
