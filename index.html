<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1> Dashboard</h1>

<div class="kpi-container">
  <div class="kpi">
    <h3>Pending</h3>
    <p id="pending">0</p>
  </div>

  <div class="kpi">
    <h3>Approved</h3>
    <p id="approved">0</p>
  </div>

  <div class="kpi">
    <h3>Rejected</h3>
    <p id="rejected">0</p>
  </div>

  <div class="kpi">
    <h3>Escalated</h3>
    <p id="escalated">0</p>
  </div>

  <div class="kpi">
    <h3>Avg Time</h3>
    <p id="avg">0</p>
  </div>
</div>

<div class="charts">
  <canvas id="statusChart"></canvas>
  <canvas id="approvalChart"></canvas>
</div>

<script src="script.js"></script>

</body>
</html>
