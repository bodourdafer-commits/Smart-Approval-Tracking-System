<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Requests</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #d9e4f5);
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 600px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #2c7be5;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            background-color: #6c757d;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>My Submitted Requests</h2>

    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>Description</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="requestsList"></tbody>
    </table>

    <button onclick="location.href='index.html'">Back</button>
</div>

<script>
async function loadRequests() {
    const response = await fetch('http://localhost:3000/my-requests/1');
    const requests = await response.json();
    const list = document.getElementById('requestsList');

    list.innerHTML = requests.map(req => `
        <tr>
            <td>${req.title}</td>
            <td>${req.description}</td>
            <td>${req.status}</td>
        </tr>
    `).join('');
}

window.onload = loadRequests;
</script>

</body>
</html>
