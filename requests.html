<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Requests - Manager Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to right, #f4f7f9, #dee2e6);
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }
        .container {
            background: white;
            padding: 30px;
            width: 800px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #003366;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border-bottom: 1px solid #eee;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #003366;
            color: white;
        }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin: 2px;
            transition: 0.3s;
        }
        .btn-approve { background-color: #28a745; }
        .btn-reject { background-color: #dc3545; }
        .btn-action:hover { opacity: 0.8; }
        
        button.back-btn {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            background-color: #6c757d;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Manager Approval Dashboard</h2>
    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions (Manager Only)</th>
            </tr>
        </thead>
        <tbody id="requestsList"></tbody>
    </table>
    <button class="back-btn" onclick="location.href='index.html'">Back to Submission</button>
</div>

<script>
async function loadRequests() {
    try {
        const response = await fetch('http://localhost:3000/my-requests/1');
        const requests = await response.json();
        const list = document.getElementById('requestsList');

        list.innerHTML = requests.map(req => `
            <tr>
                <td><strong>${req.title || req.request_type}</strong></td>
                <td>${req.description}</td>
                <td><span style="font-weight:bold; color:${req.status === 'Approved' ? 'green' : (req.status === 'Rejected' ? 'red' : 'orange')}">${req.status}</span></td>
                <td>
                    <button class="btn-action btn-approve" onclick="updateStatus(${req.id}, 'Approved')">Approve</button>
                    <button class="btn-action btn-reject" onclick="updateStatus(${req.id}, 'Rejected')">Reject</button>
                </td>
            </tr>
        `).join('');
    } catch (error) {
        console.log("Connect to server for live data");
    }
}

async function updateStatus(id, newStatus) {
    try {
        const response = await fetch(`http://localhost:3000/requests/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
        });

        if (response.ok) {
            alert(`Request ${newStatus}!`);
            loadRequests(); 
        }
    } catch {
        alert("Demo Mode: Status updated to " + newStatus);
    }
}

window.onload = loadRequests;
</script>
</body>
</html>
