<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Requests</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-wide">
        <h2>My Submitted Requests</h2>
        <table class="requests-table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="requestsList">
            </tbody>
        </table>
        <button onclick="location.href='index.html'" class="back-btn">Back to Submit</button>
    </div>

    <script>
        async function loadRequests() {
            const response = await fetch('http://localhost:3000/my-requests/1');
            const requests = await response.json();
            const list = document.getElementById('requestsList');

            list.innerHTML = requests.map(req => `
                <tr>
                    <td>${req.title}</td>
                    <td>${req.description}</td>
                    <td><span class="status ${req.status.toLowerCase()}">${req.status}</span></td>
                </tr>
            `).join('');
        }

        window.onload = loadRequests;
    </script>
</body>
</html>
